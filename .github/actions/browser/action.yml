name: Headless browser
description: Install the Chromium the play test drives; the hikae-flash image ships no browser.

runs:
  using: composite
  steps:
    - name: Install Chromium and export CHROME_BIN
      shell: bash
      # ponytail: installs on every run because the fleet has no shared browser cache.
      # Bake Chromium into projects/github-runners/flash/image when downloads dominate.
      run: |
        bunx playwright@1.62.0 install --with-deps chromium
        echo "CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*chromium-*/chrome-linux/chrome' -type f | head -1)" >> "$GITHUB_ENV"

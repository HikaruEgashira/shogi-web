name: Roll back
on:
  workflow_dispatch:
    inputs:
      release:
        description: Commit of a published release to make public
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 10
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Authenticate with AWS OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Switch the public page to the release and verify it
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          RELEASE: ${{ inputs.release }}
        run: bash scripts/promote.sh "$RELEASE"

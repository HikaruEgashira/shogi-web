name: Watch production
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Verify the served release against the pinned engine
        run: bun scripts/smoke.mjs "${SITE_URL:-https://shogi.egahika.dev/}"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Play a move in a browser
        run: bun scripts/play.mjs "${SITE_URL:-https://shogi.egahika.dev/}"
        env:
          SITE_URL: ${{ vars.SITE_URL }}

name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Cache built engine
        id: engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/engine
            public/source
          key: engine-${{ runner.os }}-${{ hashFiles('engine/manifest.json', 'engine/browser.patch', 'scripts/build-engine.sh') }}
      - name: Cache Emscripten
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/emsdk
          key: emsdk-3.1.43-${{ runner.os }}-8f685c26ee9f672081e61e22c6aa60fa972d00a9
      - name: Install pinned Emscripten
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools
          if [ ! -d .cache/emsdk/.git ]; then
            git init .cache/emsdk
            git -C .cache/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
            git -C .cache/emsdk fetch --depth 1 origin 8f685c26ee9f672081e61e22c6aa60fa972d00a9
            git -C .cache/emsdk checkout --detach FETCH_HEAD
          fi
          .cache/emsdk/emsdk install 3.1.43
          .cache/emsdk/emsdk activate 3.1.43
      - name: Build pinned WASM engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          source .cache/emsdk/emsdk_env.sh
          bun run engine
      - name: Test and build
        run: bun run check
      - name: Authenticate with AWS OIDC
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Publish and verify
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/deploy.sh

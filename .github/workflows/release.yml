name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pull request pushes supersede each other; every main commit builds in parallel into its own release.
    concurrency:
      group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Compute the engine build key
        id: engine_key
        run: echo "value=$(bun scripts/engine-inputs.mjs)" >> "$GITHUB_OUTPUT"
      - name: Cache built engine
        id: engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/engine
            public/source
          key: engine-${{ runner.os }}-${{ steps.engine_key.outputs.value }}
      - name: Fetch the published engine when its build inputs are unchanged
        id: fetch
        if: steps.engine.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shogi.egahika.dev/' }}
        run: bun run engine:fetch
      - name: Cache Emscripten
        if: steps.engine.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/emsdk
          key: emsdk-3.1.43-${{ runner.os }}-8f685c26ee9f672081e61e22c6aa60fa972d00a9
      - name: Cache Emscripten objects
        if: steps.engine.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ steps.engine_key.outputs.value }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: Install pinned Emscripten
        if: steps.engine.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools ccache
          if [ ! -d .cache/emsdk/.git ]; then
            git init .cache/emsdk
            git -C .cache/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
            git -C .cache/emsdk fetch --depth 1 origin 8f685c26ee9f672081e61e22c6aa60fa972d00a9
            git -C .cache/emsdk checkout --detach FETCH_HEAD
          fi
          .cache/emsdk/emsdk install 3.1.43
          .cache/emsdk/emsdk activate 3.1.43
      - name: Build pinned WASM engine
        if: steps.engine.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPRESS: "true"
          CCACHE_MAXSIZE: 1G
        run: |
          source .cache/emsdk/emsdk_env.sh
          bun run engine
          ccache --show-stats
      - name: Test and build
        run: bun run check
      - name: Authenticate with AWS OIDC
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Publish the release candidate and verify it through the CDN
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/publish.sh

  promote:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the switch of the public entry page is serialized; a pending switch is superseded by a newer commit's.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Authenticate with AWS OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Keep a newer commit that is already public
        id: published
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          current=$( (aws s3 cp "s3://${SITE_BUCKET}/version.json" - 2>/dev/null || true) | sed -n 's/.*"commit":"\([a-f0-9]\{40\}\)".*/\1/p')
          if [ "$current" != "$GITHUB_SHA" ] && git cat-file -e "$current" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Switch the public page, verify it, and restore the previous release on failure
        if: steps.published.outputs.superseded != 'true'
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/promote.sh "$GITHUB_SHA"
